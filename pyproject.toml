[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]

[project]
name = "lambda-csv"
version = "0.0.1"
description = "A lambda function for processing CSV files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "boto3>=1.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
platforms = ["Linux", "Windows"]
include-package-data = true
zip-safe = true

[tool.setuptools.packages.find]
where = ['api', 'processor']

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "env",
    "venv",
    "build",
    "dist",
    ".aws-sam",
]
